<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH Scully Secret Santa</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Arial, Helvetica, sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:700px;
text-align:center;
border:2px solid #ffffff;
border-radius:20px;
padding:40px;
box-shadow:0 0 25px rgba(255,255,255,0.15);
}

h1{
font-size:3rem;
letter-spacing:4px;
margin-bottom:25px;
}

.subtitle{
font-size:1rem;
margin-bottom:20px;
color:#d1d5db;
}

input{
width:100%;
padding:16px;
font-size:18px;
text-align:center;
background:#000;
color:#fff;
border:2px solid #fff;
border-radius:10px;
margin-top:10px;
}

input:focus{
outline:none;
box-shadow:0 0 15px white;
}

button{
margin-top:20px;
padding:15px 30px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
background:white;
color:black;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#dcdcdc;
}

#output{
margin-top:30px;
font-size:24px;
line-height:1.8;
white-space:pre-line;
min-height:150px;
}

.recipient{
font-size:36px;
font-weight:bold;
margin-top:15px;
}

@media(max-width:600px){

h1{
font-size:2rem;
}

#output{
font-size:18px;
}

.recipient{
font-size:28px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>RH SCULLY SECRET SANTA</h1>

<div class="subtitle">
ENTER YOUR FULL NAME
